name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android wrapper tools
        run: npm install
      - name: Create Android project
        run: npx cap add android || true
      - name: Prepare web bundle
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/
      - name: Sync web application
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes || true
          gh release create android-test android/app/build/outputs/apk/debug/app-debug.apk --title "Yolo Asistant.AI Android test" --notes "Debug APK generated from the current web build."
